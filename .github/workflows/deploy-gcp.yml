name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - deploy-prod
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Submit Cloud Build job
        id: cloud-build
        run: |
          set -euo pipefail

          BUILD_ID=$(gcloud builds submit \
            --async \
            --format="value(id)" \
            --config=cloudbuild.yaml \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --substitutions=COMMIT_SHA=${{ github.sha }})

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "Submitted Cloud Build: $BUILD_ID"
          echo "Build logs: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=${{ secrets.GCP_PROJECT_ID }}"

      - name: Wait for Cloud Build
        run: |
          set -euo pipefail

          for attempt in {1..80}; do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project=${{ secrets.GCP_PROJECT_ID }} \
              --format="value(status)")

            echo "Cloud Build $BUILD_ID status: $STATUS"

            case "$STATUS" in
              SUCCESS)
                exit 0
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                gcloud builds log "$BUILD_ID" --project=${{ secrets.GCP_PROJECT_ID }} || true
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "::error::Cloud Build $BUILD_ID did not finish within 20 minutes."
          gcloud builds log "$BUILD_ID" --project=${{ secrets.GCP_PROJECT_ID }} || true
          exit 1

      - name: Get Cloud Run service URL
        run: |
          URL=$(gcloud run services describe stocksense-backend \
            --region=asia-south1 \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --format="value(status.url)")
          echo "Deployed to: $URL"
          echo "SERVICE_URL=$URL" >> $GITHUB_ENV

      - name: Health check
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed (HTTP $STATUS)"
          else
            echo "❌ Health check failed (HTTP $STATUS)"
            exit 1
          fi
