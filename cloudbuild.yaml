# Cloud Build pipeline for StockSense backend
# Triggered by push to deploy-prod branch via GitHub Actions

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/stocksense-prod/stocksense-repo/stocksense-backend:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/stocksense-prod/stocksense-repo/stocksense-backend:latest'
      - '.'
    id: 'build-image'

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'asia-south1-docker.pkg.dev/stocksense-prod/stocksense-repo/stocksense-backend'
    id: 'push-image'
    waitFor: ['build-image']

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'stocksense-backend'
      - '--image=asia-south1-docker.pkg.dev/stocksense-prod/stocksense-repo/stocksense-backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=4Gi'
      - '--cpu=4'
      - '--min-instances=1'
      - '--max-instances=5'
      - '--timeout=3600'
      - '--concurrency=80'
      - '--set-secrets=GOOGLE_API_KEY=GOOGLE_API_KEY:latest,NEWSAPI_KEY=NEWSAPI_KEY:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_SERVICE_KEY=SUPABASE_SERVICE_KEY:latest,CORS_ORIGINS=CORS_ORIGINS:latest'
      - '--project=stocksense-prod'
    id: 'deploy-cloud-run'
    waitFor: ['push-image']


images:
  - 'asia-south1-docker.pkg.dev/stocksense-prod/stocksense-repo/stocksense-backend:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/stocksense-prod/stocksense-repo/stocksense-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
